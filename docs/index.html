<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almox · Meu estoque</title><link rel="icon" href="./icone.svg"><link rel="stylesheet" href="./estilo.css">
<header><div class="wrap nav"><div class="brand"><img width="38" height="38" src="./icone.svg" alt="">Almox</div><button id="sair" hidden>Sair</button></div></header>
<main class="wrap"><section class="hero"><div><h1>Meu estoque</h1><p>Cadastro e localização de produtos.</p></div></section>
<section id="acesso" class="card entry"><h2>Entrar no estoque</h2><form id="login">
<label for="email">E-mail</label><input type="email" id="email" autocomplete="username" required>
<label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" required>
<button class="primary">Entrar</button></form></section>
<div id="painel" class="grid" hidden><section class="card entry"><h2 id="titulo">Novo produto</h2>
<form id="cadastro"><label for="codigo">Código</label><input id="codigo" maxlength="64" required placeholder="Ex. 00125">
<label for="nome">Nome do produto</label><input id="nome" maxlength="160" required placeholder="Ex. Cabo de rede">
<label for="localizacao">Localização</label><input id="localizacao" maxlength="160" required placeholder="Ex. Prateleira B2">
<button id="salvar" class="primary">Cadastrar produto</button><button type="button" id="cancelar" class="secondary" hidden>Cancelar edição</button></form></section>
<section class="card catalog"><h2>Produtos cadastrados</h2><div class="search"><input id="busca" type="search" aria-label="Buscar produtos" placeholder="Buscar por código, nome ou localização"></div>
<div class="tablebox"><table><thead><tr><th>Código</th><th>Produto</th><th>Localização</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div><p id="vazio"></p><button id="recarregar" class="secondary">Atualizar lista</button></section></div>
<p id="mensagem" role="status" aria-live="polite"></p></main>
<script type="module" src="./estoque.js"></script></html>
